# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - whitechecker

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      # 빌드 결과 폴더(.next)는 이름이 점으로 시작해서, 폴더째 올리면 upload-artifact가 빼고 올린다.
      # 그래서 실행에 필요한 것을 zip 하나로 묶어 올린다. 빌드 캐시(.next/cache)는 실행에 쓰이지 않아 뺀다.
      - name: Zip artifact for deployment
        run: zip -qr release.zip ./* .next -x '.next/cache/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_81855EB07004409585EC55339F0EC1A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_846DB22E4EA6437DACCFF473E8AD1210 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0EC572E22BFE4119B20577F93939F443 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'whitechecker'
          slot-name: 'Production'
          package: release.zip
